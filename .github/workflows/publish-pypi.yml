# Publishes clients/python to PyPI as "yieldterminal" with PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# Run by hand from the Actions tab (workflow_dispatch) after bumping the version in clients/python/pyproject.toml.
name: publish-pypi
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Test against the live no-key endpoints
        working-directory: clients/python
        run: |
          python -m pip install dist/*.whl pytest
          python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: clients/python/dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
